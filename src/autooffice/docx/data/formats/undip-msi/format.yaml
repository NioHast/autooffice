# Format: Universitas Diponegoro - Magister Sistem Informasi (UNDIP MSI)
# Nilai format, identitas, CSL, dan bibliography untuk struktur UNDIP MSI.
# Nomor bab (prefix/format) tidak disimpan di sini karena berbeda per
# struktur; lihat structures/<id>/structure.yaml bagian numbering.
# Skema mengikuti kontrak DOCX di docs/contracts/docx.md.
format: undip-msi
name: "Universitas Diponegoro - Magister Sistem Informasi"
description: "Margin 4/3/4/3 cm, Times New Roman 12 pt, spasi 1,5, sitasi author-date UNDIP MSI."

page:
  # Ukuran/orientasi/jarak header-footer memakai nilai kontrak format.
  size: A4
  orientation: portrait
  # Margin halaman: atas 4 cm, bawah 3 cm, kiri 4 cm, kanan 3 cm.
  margins:
    top: 4cm
    bottom: 3cm
    left: 4cm
    right: 3cm
  header_distance: 1.27cm
  footer_distance: 1.27cm
  gutter: 0cm
  # Nama style heading untuk field STYLEREF di header body. Nomor bab ikut
  # tercetak karena nomor heading berupa teks literal. Hapus key ini untuk
  # header body tanpa judul bab.
  header_style_ref: "Heading 1"

font:
  body:
    # Teks normal: Times New Roman 12 pt, spasi 1,5.
    family: "Times New Roman"
    size: 12pt
    # 360 twip = 1,5 baris
    line_spacing: 1.5
    space_before: 0pt
    space_after: 0pt
    alignment: both
    first_line_indent: 1.25cm
  monospace:
    # Font kode sumber: Courier New 10 pt.
    family: "Courier New"
    size: 10pt

abstract:
  # Isi dan kata kunci abstrak: Times New Roman 10 pt, spasi 1,0.
  font: "Times New Roman"
  size: 10pt
  line_spacing: 1.0
  space_before: 0pt
  space_after: 0pt
  alignment: both

headings:
  styles:
    heading1:
      # Heading 1: rata tengah, Times New Roman 12 pt bold, spasi 1,5.
      font_family: "Times New Roman"
      font_size: 12pt
      bold: true
      color: "000000"
      alignment: center
      space_before: 0pt
      space_after: 0pt
      # 360 twip = 1,5 baris
      line_spacing: 1.5
      keep_next: true
      keep_lines: true
      outline_level: 0
      first_line_indent: 0cm
    heading2:
      # Heading 2: rata kiri-kanan, indentasi 1,25 cm, spasi 1,5.
      font_family: "Times New Roman"
      font_size: 12pt
      bold: true
      color: "000000"
      alignment: both
      space_before: 0pt
      space_after: 0pt
      # 360 twip = 1,5 baris
      line_spacing: 1.5
      keep_next: true
      keep_lines: true
      outline_level: 1
      indent_left: 1.25cm
      indent_hanging: 1.25cm
    heading3:
      # Heading 3: rata kiri-kanan, indentasi 1,25 cm, spasi 1,5.
      font_family: "Times New Roman"
      font_size: 12pt
      bold: true
      color: "000000"
      alignment: both
      space_before: 0pt
      space_after: 0pt
      # 360 twip = 1,5 baris
      line_spacing: 1.5
      keep_next: true
      keep_lines: true
      outline_level: 2
      indent_left: 1.25cm
      indent_hanging: 1.25cm

# Gaya judul daftar isi. Toggle daftar isi ada di structure.yaml (`toc`),
# bukan di sini.
toc_heading:
  heading_style: "TOCHeading"
  # Font judul daftar isi: Times New Roman 12 pt.
  font: "Times New Roman"
  size: 12pt
  bold: true
  color: "000000"
  alignment: center
  space_before: 0pt
  space_after: 0pt
  # 360 twip = 1,5 baris
  line_spacing: 1.5
  first_line_indent: 0cm

captions:
  figure:
    # Caption gambar: Times New Roman 10 pt, spasi 1,0.
    font:
      family: "Times New Roman"
      size: 10pt
      bold: false
      italic: false
      space_before: 0pt
      space_after: 0pt
      # 240 twip = 1,0 baris
      line_spacing: 1.0
  table:
    # Caption tabel: Times New Roman 10 pt, rata kiri, spasi 1,0.
    keep_next: true
    font:
      family: "Times New Roman"
      size: 10pt
      bold: false
      italic: false
      alignment: left
      space_before: 0pt
      space_after: 0pt
      # 240 twip = 1,0 baris
      line_spacing: 1.0

# Perataan caption gambar dan counter caption gambar/tabel.
figures:
  # Perataan caption dan gambar: rata tengah.
  caption_alignment: center
  image_alignment: center
  numbering: chapter
  space_before: 0pt
  space_after: 0pt
  first_line_indent: 0cm

code:
  # Blok kode sumber: Courier New 10 pt, border tunggal, cell margin 108 twip.
  font:
    family: "Courier New"
    size: 10pt
  # 240 twip = 1,0 baris
  line_spacing: 1.0
  space_before: 0pt
  space_after: 0pt
  shading: none
  # Perataan kode sumber: rata kiri.
  alignment: left
  border:
    style: single
    width: 1pt
    color: "000000"
  table:
    width: 100%
    cell_margin: 108twip
  # Style karakter token syntax highlighting (styleId Pandoc). Semua style
  # token selalu dideklarasikan oleh style_reference; entri di bawah memberi
  # warna/bold/italic agar tampilan kode sama dengan sebelumnya. Tanpa entri,
  # token mewarisi font dan warna `code.font`.
  highlight:
    AlertTok: {bold: true, color: "FF0000"}
    AnnotationTok: {bold: true, italic: true, color: "60A0B0"}
    AttributeTok: {color: "7D9029"}
    BaseNTok: {color: "40A070"}
    BuiltInTok: {color: "008000"}
    CharTok: {color: "4070A0"}
    CommentTok: {italic: true, color: "60A0B0"}
    CommentVarTok: {bold: true, italic: true, color: "60A0B0"}
    ConstantTok: {color: "880000"}
    ControlFlowTok: {bold: true, color: "007020"}
    DataTypeTok: {color: "902000"}
    DecValTok: {color: "40A070"}
    DocumentationTok: {italic: true, color: "BA2121"}
    ErrorTok: {bold: true, color: "FF0000"}
    ExtensionTok: {}
    FloatTok: {color: "40A070"}
    FunctionTok: {color: "06287E"}
    ImportTok: {bold: true, color: "008000"}
    InformationTok: {bold: true, italic: true, color: "60A0B0"}
    KeywordTok: {bold: true, color: "007020"}
    NormalTok: {}
    OperatorTok: {color: "666666"}
    OtherTok: {color: "007020"}
    PreprocessorTok: {color: "BC7A00"}
    RegionMarkerTok: {}
    SpecialCharTok: {color: "4070A0"}
    SpecialStringTok: {color: "BB6688"}
    StringTok: {color: "4070A0"}
    VariableTok: {color: "19177C"}
    VerbatimStringTok: {color: "4070A0"}
    WarningTok: {bold: true, italic: true, color: "60A0B0"}

# Gaya daftar pustaka. Path file .bib ada di citation.bibliography.
bibliography_style:
  heading: "DAFTAR PUSTAKA"
  # Font daftar pustaka: Times New Roman 12 pt, spasi 1,5.
  font: "Times New Roman"
  size: 12pt
  # 360 twip = 1,5 baris
  line_spacing: 1.5
  space_before: 0pt
  space_after: 0pt
  indent_left: 1.27cm
  indent_hanging: 1.27cm

citation:
  csl: citation.csl
  # Berkas bibliography relatif terhadap format ini.
  bibliography: references.bib

# Ukuran dan visibilitas cover ada di structure.cover, bukan di sini.
assets:
  logo: logo.jpg
  reference_docx: reference.docx
