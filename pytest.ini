[pytest]
testpaths = tests
pythonpath = src .
addopts = --strict-markers -m "not slow"
markers =
    unit: tes cepat yang tidak menyentuh Pandoc/PlantUML
    integration: tes yang membutuhkan Pandoc atau artefak build
    packaging: tes packaging repo-local atau wheel
    slow: tes berat seperti deck 500 slide atau render PPTX
